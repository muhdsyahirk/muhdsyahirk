<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog | Muhd Syahir</title>
    <link rel="icon" href="../img/dumpling-logo.png" />
    <link rel="stylesheet" href="../style.css" />
    <script src="../script.js" defer></script>
    <script type="module" src="./blog.js"></script>
    <script
      src="https://kit.fontawesome.com/ec08b82533.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- LOADER -->
    <div id="loader">
      <div class="loader"></div>
    </div>
    <!-- NAV -->
    <nav>
      <div class="nav-container">
        <div class="nav-img">
          <a href="../index.html#main"
            ><img src="../img/dumpling-logo.png" alt="Q"
          /></a>
        </div>
        <a class="nav-burger"><i class="fa-solid fa-bars"></i></a>
        <ul class="nav-item">
          <li><a href="../index.html#about">ABOUT</a></li>
          <li><a href="../index.html#skill">SKILLS</a></li>
          <li><a href="../index.html#project">PROJECTS</a></li>
          <li><a href="#">BLOG</a></li>
        </ul>
      </div>
    </nav>
    <!-- BLOG -->
    <div class="blog">
      <div class="blog-blog">
        <div class="blog-title">
          <h1>MY <span class="text-color">WRITE-UPS & WRITINGS</span></h1>
        </div>
        <div class="blog-row">
          <div class="blog-nav">
            <div class="terminal-nav">
              <div class="terminal-header">
                <div class="terminal-header-left">
                  <i class="fa-solid fa-terminal"></i>
                </div>
                <div class="terminal-header-mid">syahir@blog: ~</div>
                <div class="terminal-header-right">
                  <i class="fa-solid fa-xmark"></i>
                </div>
              </div>
              <div class="terminal-body">
                <div class="terminal-prompt">
                  <span class="terminal-sign">$</span>
                  <input
                    type="text"
                    id="terminal-input"
                    placeholder="Type 'help' to get started"
                    autofocus
                    autocomplete="off"
                    spellcheck="false"
                  />
                </div>
                <div class="terminal-output"></div>
              </div>
            </div>
            <div class="year-nav">
              <h3>Jump to...</h3>
              <div class="year-links" id="year-links"></div>
            </div>
          </div>
          <div class="blog-posts"></div>
        </div>
      </div>
    </div>
    <!-- FOOTER -->
    <footer>
      <div class="footer-container">
        <p>
          <i class="fa-regular fa-copyright"></i> 2025
          <span class="text-bold">Muhd Syahir</span>. All Rights Reserved.
        </p>
        <p>Made from scratch | Icon by <span class="text-bold">Q</span></p>
      </div>
    </footer>
  </body>
</html>
